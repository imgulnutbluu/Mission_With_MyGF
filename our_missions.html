<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>OUR-RULES</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://missionwithmygf-78c9a-default-rtdb.asia-southeast1.firebasedatabase.app/", 
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ทำให้ฟังก์ชันของ Firebase ใช้งานในหน้าเว็บหลักได้
    window.dbRef = ref;
    window.dbSet = set;
    window.dbOnValue = onValue;
    window.db = db;
  </script>
<style>
:root{
  --bg: #f3f5ff;
  --bg-2: #eefaf3;
  --card: rgba(255,255,255,0.9);
  --line: #e5e7f3;
  --text: #1f2937;
  --muted: #667085;
  --primary: #5a67f2;
  --primary-strong: #3d4de6;
  --green: #22a06b;
  --green-soft: #dff8ee;
  --red: #ef4444;
  --red-soft: #ffe4e6;
  --amber: #f59e0b;
  --shadow: 0 12px 30px rgba(90, 103, 242, 0.12);
}
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
body{
  margin:0;
  min-height:100vh;
  padding:22px 16px 40px;
  background:linear-gradient(135deg,var(--bg) 0%, var(--bg-2) 100%);
  color:var(--text);
}
.page-shell{max-width:1120px;margin:0 auto}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;margin:0 auto 18px;max-width:980px;
}
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  padding:8px 14px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:1.5px;
  background:#fff;color:var(--primary);border:1px solid rgba(90,103,242,0.2);box-shadow:var(--shadow);
}
.badge.alt{background:linear-gradient(135deg,#ebfff3,#e8f1ff);color:#156c43}
h1{
  text-align:center;color:#1c9f1e;letter-spacing:3px;margin:0;
  font-size:clamp(2.1rem,4vw,3rem);font-weight:900;
  text-shadow:0 6px 20px rgba(28,159,30,0.16);
}
.center{text-align:center}
.card{
  background:var(--card);
  border:1px solid rgba(255,255,255,0.75);
  border-radius:18px;padding:16px 18px;margin:18px auto;max-width:980px;
  box-shadow:var(--shadow);backdrop-filter:blur(8px);
}
.card h3{margin:0 0 8px;font-size:16px}
.sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.toolbar{margin-top:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
.row label{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted)}
.tab{
  padding:10px 18px;border:2px solid var(--primary);background:#fff;color:var(--primary);
  border-radius:999px;cursor:pointer;font-weight:800;transition:.2s ease;
}
.tab:hover{transform:translateY(-1px)}
.tab.on{background:linear-gradient(135deg,var(--primary),var(--primary-strong));color:#fff;box-shadow:0 8px 18px rgba(90,103,242,0.22)}
.days{display:flex;flex-wrap:wrap;gap:6px}
.day{position:relative;width:46px;height:48px;border:1px solid #dfe5f4;border-radius:12px;background:#fafbff;cursor:pointer;font-size:11px;line-height:1.2;padding:2px;text-align:center;user-select:none;transition:transform .15s ease}
.day:hover{transform:translateY(-1px)}
.day.ok{background:var(--green-soft);border-color:#46b272}
.day.no{background:var(--red-soft);border-color:#f87171}
.day.skip{background:#f3f4f6;border-color:#a1a1aa;color:#666}
.day.today{box-shadow:0 0 0 2px rgba(245,158,11,0.8)}
.day b{display:block;font-size:13px;font-weight:800;margin-top:4px}
.day i{position:absolute;top:2px;right:4px;font-style:normal;font-size:9px;color:var(--primary)}
input,button,select{padding:9px 10px;border-radius:10px;border:1px solid #d7dcea;font-size:14px}
input:focus{outline:2px solid rgba(90,103,242,0.15);border-color:var(--primary)}
button.add{background:linear-gradient(135deg,var(--primary),var(--primary-strong));color:#fff;border:0;cursor:pointer;padding:10px 16px;font-weight:700}
button.mini{padding:4px 8px;font-size:12px;cursor:pointer;border:1px solid #cbd5e1;background:#fff}
button{transition:all .15s ease}
button:hover{filter:brightness(0.98)}
ul{list-style:none;padding:0;margin:8px 0}
li{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;background:#f8f9ff;border:1px solid #edf0ff;border-radius:12px;margin-bottom:6px;font-size:14px;align-items:center}
li.ex{opacity:.7;background:#f5f5f5;border-color:#e5e7eb}
li .del{background:linear-gradient(135deg,#ff6b6b,#e53935);color:#fff;border:0;padding:4px 8px;cursor:pointer;border-radius:8px}
.fine{float:right;font-weight:800;color:#d62b2b}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid #edf0f7;padding:10px 8px;text-align:left}
td.num,th.num{text-align:right}
tr.total td{font-size:18px;font-weight:900;color:#d62b2b;border-top:2px solid #1f2937}
.warn{color:#d97706;font-size:12px;margin-top:6px;font-weight:700}
.notes{font-size:12px;color:#4b5563;background:#f7f8fc;border:1px solid #eef1fa;border-radius:10px;padding:8px 10px;margin-top:8px}
.wk{font-size:12px;color:#485366;display:flex;gap:8px;align-items:center;justify-content:space-between;margin:6px 0;padding:8px 10px;border:1px solid #edf0f7;border-radius:10px;background:#fbfcff;flex-wrap:wrap}
.footer-actions{margin:18px auto 0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.footer-actions button{padding:10px 16px;border:1px solid #d7dcea;background:#fff;color:#1f2937;font-weight:700;cursor:pointer;border-radius:10px}
.footer-actions button:first-child{background:linear-gradient(135deg,#eff6ff,#e0f2fe);border-color:#bfdcff;color:#1d4ed8}
</style>
</head>
<body>
<div class="page-shell">
  <header class="topbar">
    <div class="badge">MISSION</div>
    <h1>OUR RULES</h1>
    <div class="badge alt">WITH MY GF</div>
  </header>

  <div class="card toolbar">
    <div class="row" style="justify-content:center">
      <label>เดือน <input type="month" id="ym"></label>
      <button class="tab on" data-p="tai">น้องต่าย</button>
      <button class="tab" data-p="ben">พี่เบ้บ</button>
    </div>
    <div class="sub center">แตะช่องวันเพื่อวนสถานะ • แตะสองครั้ง (ดับเบิลคลิก) เพื่อใส่/แก้หมายเหตุ</div>
  </div>

  <div id="app"></div>

  <div class="card">
    <h3>สรุปค่าปรับเดือนนี้</h3>
    <div id="sum"></div>
  </div>

  <div class="footer-actions">
    <button onclick="expJSON()">สำรองข้อมูล</button>
    <button onclick="if(confirm('ล้างข้อมูลเดือนนี้?')){S=blank();save();render()}">ล้างข้อมูลเดือนนี้</button>
  </div>
</div>

<script>
const RULES=[
 {id:'shower',n:'อาบน้ำก่อน 21:40 น.',t:'daily',f:{tai:5,beb:15}},
 {id:'sleep', n:'นอนก่อน 24:00 น.',   t:'daily',f:{tai:5,beb:10}},
 {id:'water', n:'ดื่มน้ำ 1.7 L/วัน',   t:'daily',f:{tai:10,beb:15}},
 {id:'drink', n:'น้ำหวาน',            t:'quota',q:{tai:4,beb:4},  f:{tai:10,beb:20}},
 {id:'sweet', n:'ขนมหวาน (รวมกรุบกรอบ)',t:'quota',q:{tai:10,beb:6},f:{tai:5,beb:20}},
 {id:'exercise',n:'ออกกำลังกาย 20 นาที',t:'week',per:3,f:{tai:10,beb:20}},
 {id:'veggie',n:'กินผัก',             t:'month',target:3,f:{tai:10,beb:15}}
];
const DAILY=['shower','sleep','water'],LISTS=['drink','sweet','exercise','veggie'];
const mk=()=>({shower:{},sleep:{},water:{},drink:[],sweet:[],exercise:[],veggie:[],exWeek:{},exMonth:{},save:0});
const blank=()=>({tai:mk(),beb:mk()});
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

const ymEl=document.getElementById('ym');
const now=new Date();
const localMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
ymEl.value=localMonth;
let P='tai', S=blank();

function key(){return 'ourrules_'+ymEl.value}
function norm(o){const b=mk();o=o||{};
  DAILY.forEach(k=>{const src=o[k]||{};const out={};
    for(const d in src){const v=src[d];out[d]=(typeof v==='string')?{v:v,note:''}:{v:v.v||'',note:v.note||''}}
    b[k]=out});
  LISTS.forEach(k=>b[k]=(o[k]||[]).map(x=>({date:x.date,note:x.note||'',ex:!!x.ex})));
  b.exWeek=o.exWeek||{};b.exMonth=o.exMonth||{};b.save=o.save||0;return b}

  // ฟังก์ชันบันทึกข้อมูลขึ้น Firebase
function save(){
  if(window.dbSet && window.db && window.dbRef){
    window.dbSet(window.dbRef(window.db, 'ourrules/' + ymEl.value), S);
  }
}

// ฟังก์ชันโหลดข้อมูลและรอรับการอัปเดตแบบเรียลไทม์
function listenForUpdates() {
  if(window.dbOnValue && window.db && window.dbRef){
    const monthRef = window.dbRef(window.db, 'ourrules/' + ymEl.value);
    window.dbOnValue(monthRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        S = { tai: norm(data.tai), beb: norm(data.beb) };
      } else {
        S = blank(); // ถ้าไม่มีข้อมูลในเดือนนั้นให้เริ่มใหม่
      }
      render(); // สั่งให้อัปเดตหน้าจอทันทีเมื่อข้อมูลเปลี่ยน
    });
  }
}

// ผูกการทำงานตอนเปลี่ยนเดือน
ymEl.onchange=()=>{
  S = blank(); 
  render();
  listenForUpdates(); // ดึงข้อมูลเดือนใหม่
};

// เรียกใช้งานครั้งแรกตอนโหลดหน้าเว็บ
setTimeout(() => {
  listenForUpdates();
}, 500); // ดีเลย์เล็กน้อยรอให้ Firebase โหลดเสร็จ

function ymParts(){const[a,b]=ymEl.value.split('-');return[+a,+b]}
function dim(){const[y,m]=ymParts();return new Date(y,m,0).getDate()}
function todayD(){const t=new Date(),[y,m]=ymParts();
  return(t.getFullYear()===y&&t.getMonth()+1===m)?t.getDate():0}
function passedDay(){const[y,m]=ymParts(),t=new Date(),ty=t.getFullYear(),tm=t.getMonth()+1;
  if(y<ty||(y===ty&&m<tm))return dim();
  if(y>ty||(y===ty&&m>tm))return 0;
  return t.getDate()}
const sameMonth=s=>s.slice(0,7)===ymEl.value, dnum=s=>+s.slice(8,10);
const counted=x=>!x.ex&&sameMonth(x.date);

/* ---------- คำนวณ ---------- */
function weekBlocks(p){
  const list=S[p].exercise,D=dim(),PD=passedDay(),bl=[];let miss=0;
  for(let s=1,i=0;s<=D;s+=7,i++){
    const e=Math.min(s+6,D),len=e-s+1,tg=Math.max(1,Math.round(3*len/7));
    const c=list.filter(x=>counted(x)&&dnum(x.date)>=s&&dnum(x.date)<=e).length;
    const ex=S[p].exWeek[i]!==undefined,closed=e<=PD;
    if(closed&&!ex)miss+=Math.max(0,tg-c);
    bl.push({i,s,e,tg,c,closed,ex,note:S[p].exWeek[i]||''});
  }
  return{miss,bl};
}
function fines(p){
  const s=S[p],r={},monthOver=passedDay()>=dim();
  RULES.forEach(R=>{
    if(R.t==='daily'){let m=0,sk=0;
      for(const d in s[R.id]){const v=s[R.id][d].v;if(v==='no')m++;if(v==='skip')sk++}
      r[R.id]={amt:m*R.f[p],txt:'ผิด '+m+' วัน'+(sk?' • ยกเว้น '+sk+' วัน':''),pend:0}}
    if(R.t==='quota'){const all=s[R.id].filter(sameMonthEvt),n=all.filter(x=>!x.ex).length,ex=all.length-n,ov=Math.max(0,n-R.q[p]);
      r[R.id]={amt:ov*R.f[p],txt:n+'/'+R.q[p]+' ครั้ง'+(ov?' → เกิน '+ov:'')+(ex?' • ยกเว้น '+ex:''),pend:0}}
    if(R.t==='week'){const w=weekBlocks(p);
      r[R.id]={amt:w.miss*R.f[p],txt:'ขาด '+w.miss+' ครั้ง (นับเฉพาะสัปดาห์ที่จบแล้ว)',bl:w.bl,pend:0}}
    if(R.t==='month'){const n=s[R.id].filter(counted).length,ex=s.exMonth.veggie!==undefined,
      sh=ex?0:Math.max(0,R.target-n);
      r[R.id]={amt:(monthOver?sh*R.f[p]:0),pend:(monthOver?0:sh*R.f[p]),
        txt:n+'/'+R.target+' ครั้ง'+(ex?' • ยกเว้นทั้งเดือน':(monthOver?'':' • ยังไม่ตัดจนจบเดือน'))}}
  });
  r.total=RULES.reduce((a,R)=>a+r[R.id].amt,0);
  r.pending=RULES.reduce((a,R)=>a+(r[R.id].pend||0),0);
  return r;
}
function sameMonthEvt(x){return sameMonth(x.date)}

/* ---------- แสดงผล ---------- */
function render(){
  const s=S[P],F=fines(P),D=dim(),TD=todayD();let h='';
  RULES.forEach(R=>{
    h+='<div class="card"><h3>'+R.n+' <span class="fine">'+F[R.id].amt+' ฿</span></h3>';
    h+='<div class="sub">ปรับครั้งละ '+R.f[P]+' ฿ • '+F[R.id].txt+'</div>';
    if(R.t==='daily'){
      h+='<div class="days">';
      for(let d=1;d<=D;d++){
        const c=s[R.id][d]||{v:'',note:''};
        const ic=c.v==='ok'?'✅':c.v==='no'?'❌':c.v==='skip'?'🚫':'–';
        h+='<div class="day '+c.v+(d===TD?' today':'')+'" title="'+esc(c.note)+'" '+
           'onclick="cyc(\''+R.id+'\','+d+')" ondblclick="noteD(\''+R.id+'\','+d+')">'+
           '<b>'+d+'</b>'+ic+(c.note?'<i>✎</i>':'')+'</div>';
      }
      h+='</div>';
      const ns=[];for(let d=1;d<=D;d++){const c=s[R.id][d];if(c&&c.note)ns.push(d+' '+(c.v==='skip'?'🚫':c.v==='no'?'❌':'✅')+' '+esc(c.note))}
      if(ns.length)h+='<div class="notes">📝 '+ns.join(' • ')+'</div>';
      h+='<div class="sub">แตะ: – → ✅ → ❌ → 🚫 ยกเว้น เพื่อใส่หมายเหตุ , วันที่ยังไม่กด = ไม่คิดเงิน</div>';
    } else {
      const ph=R.id==='sweet'?'เช่น โรตี, เค้ก, มันฝรั่งทอด':R.id==='drink'?'เช่น ชาไข่มุก':R.id==='exercise'?'เช่น วิ่ง 20 นาที':'เช่น ผัดผักรวม';
      h+='<div class="row"><input type="date" id="d_'+R.id+'" value="'+defDate()+'">'+
         '<input id="n_'+R.id+'" placeholder="'+ph+'" style="flex:1;min-width:170px">'+
         '<button class="add" onclick="addE(\''+R.id+'\')">+ เพิ่ม</button></div><ul>';
      s[R.id].forEach((x,i)=>{
        h+='<li class="'+(x.ex?'ex':'')+'"><span>'+x.date+' — '+esc(x.note||'-')+(x.ex?' 🚫 ไม่นับ':'')+'</span>'+
           '<span><button class="mini" onclick="toggleEx(\''+R.id+'\','+i+')">'+(x.ex?'นับ':'ยกเว้น')+'</button> '+
           '<button class="mini" onclick="editE(\''+R.id+'\','+i+')">✎</button> '+
           '<button class="del" onclick="delE(\''+R.id+'\','+i+')">ลบ</button></span></li>';
      });
      h+='</ul>';
      if(R.t==='week'){F[R.id].bl.forEach(b=>{
        h+='<div class="wk"><span>สัปดาห์ '+(b.i+1)+' (วันที่ '+b.s+'–'+b.e+'): '+b.c+'/'+b.tg+
           (b.ex?' 🚫 ยกเว้น'+(b.note?' — '+esc(b.note):''):(b.closed?(b.c>=b.tg?' ✅ ผ่าน':' ❌ ขาด '+(b.tg-b.c)):' ⏳ ยังไม่จบ'))+'</span>'+
           '<button class="mini" onclick="exWeek('+b.i+')">'+(b.ex?'ยกเลิกยกเว้น':'ยกเว้นสัปดาห์นี้')+'</button></div>'});}
      if(R.t==='month'){
        const ex=s.exMonth.veggie!==undefined;
        h+='<div class="wk"><span>'+(ex?'🚫 ยกเว้นเป้าเดือนนี้'+(s.exMonth.veggie?' — '+esc(s.exMonth.veggie):''):'นับตามปกติ')+'</span>'+
           '<button class="mini" onclick="exMonth()">'+(ex?'ยกเลิกยกเว้น':'ยกเว้นเดือนนี้')+'</button></div>';
        if(F[R.id].pend)h+='<div class="warn">⏳ ถ้าจบเดือนยังไม่ครบ จะโดนปรับ '+F[R.id].pend+' ฿</div>';
      }
    }
    h+='</div>';
  });
  h+='<div class="card"><h3>ออมเงิน 200–300 ฿/เดือน</h3><div class="row">'+
     '<input type="number" value="'+(s.save||0)+'" oninput="S[P].save=+this.value;save();render()"> ฿</div>'+
     '<div class="sub">'+((s.save||0)>=200?'✅ ครบเป้าแล้ว':'ยังขาดอีก '+(200-(s.save||0))+' ฿')+'</div></div>';
  document.getElementById('app').innerHTML=h;
  summary();
}
function defDate(){const t=new Date(),iso=t.toISOString().slice(0,10);
  return iso.slice(0,7)===ymEl.value?iso:ymEl.value+'-01'}
function cyc(id,d){
  const o=S[P][id],c=o[d]||{v:'',note:''},seq={'':'ok',ok:'no',no:'skip',skip:''};
  c.v=seq[c.v];o[d]=c;
  if(c.v==='skip'){const n=prompt('หมายเหตุการยกเว้นวันที่ '+d,c.note||'');if(n!==null)c.note=n}
  if(!c.v&&!c.note)delete o[d];
  save();render();
}
function noteD(id,d){const o=S[P][id],c=o[d]||{v:'',note:''};
  const n=prompt('หมายเหตุวันที่ '+d,c.note||'');if(n===null)return;
  c.note=n;o[d]=c;if(!c.v&&!c.note)delete o[d];save();render()}
function addE(id){
  const d=document.getElementById('d_'+id).value,n=document.getElementById('n_'+id).value.trim();
  if(!d)return alert('ใส่วันที่ด้วยนะ');
  S[P][id].push({date:d,note:n,ex:false});
  S[P][id].sort((a,b)=>a.date<b.date?-1:1);
  document.getElementById('n_'+id).value='';save();render();
}
function editE(id,i){const x=S[P][id][i],n=prompt('แก้หมายเหตุ',x.note||'');if(n===null)return;x.note=n;save();render()}
function toggleEx(id,i){const x=S[P][id][i];
  if(!x.ex){const n=prompt('เหตุผลที่ยกเว้นรายการนี้',x.note||'');if(n!==null&&n)x.note=n}
  x.ex=!x.ex;save();render()}
function delE(id,i){S[P][id].splice(i,1);save();render()}
function exWeek(i){const w=S[P].exWeek;
  if(w[i]!==undefined)delete w[i];else{const n=prompt('เหตุผลที่ยกเว้นสัปดาห์นี้','');if(n===null)return;w[i]=n}
  save();render()}
function exMonth(){const m=S[P].exMonth;
  if(m.veggie!==undefined)delete m.veggie;else{const n=prompt('เหตุผลที่ยกเว้นเป้ากินผักเดือนนี้','');if(n===null)return;m.veggie=n}
  save();render()}
function summary(){
  const A=fines('tai'),B=fines('beb');
  let h='<table><tr><th>กติกา</th><th class="num">น้องต่าย</th><th class="num">พี่เบ้บ</th></tr>';
  RULES.forEach(R=>{h+='<tr><td>'+R.n+'</td><td class="num">'+A[R.id].amt+' ฿</td><td class="num">'+B[R.id].amt+' ฿</td></tr>'});
  h+='<tr class="total"><td>TOTAL</td><td class="num">'+A.total+' ฿</td><td class="num">'+B.total+' ฿</td></tr></table>';
  h+='<div class="sub">รวมทั้งคู่ <b>'+(A.total+B.total)+' ฿</b> • ออมเงิน ต่าย '+(S.tai.save||0)+' ฿ / เบ้บ '+(S.beb.save||0)+' ฿</div>';
  if(A.pending||B.pending)h+='<div class="warn">⏳ ยอดค้างรอจบเดือน: ต่าย '+A.pending+' ฿ / เบ้บ '+B.pending+' ฿</div>';
  document.getElementById('sum').innerHTML=h;
}

  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});

}
